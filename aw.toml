[project]
name = "defer"
# Shared SaaS service skeleton (aw docs/standards/saas-service.md, S5).
kind = "saas-service"
cap_path = "README.md"
label = "app:defer"

[capability.profile]
traits = ["long_running", "cli_facing", "competitive_replacement", "network_exposed", "http2_api", "kubernetes_native", "primary_replicas", "stateful_storage"]

[[workspaces]]
name = "defer"
paths = ["**"]
target = "rust"
test_cmd = "cargo test --workspace"
codegen.profile = "rust/score-crate"
