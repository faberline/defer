[workspace]
resolver = "2"
# One crate per defer module group plus the shared kernel and the `defer`
# assembly crate (see ddd.toml and docs/adr/0001-multi-crate-workspace.md).
# Generic service infrastructure comes from faberline/core, never from here.
members = ["crates/*"]

[workspace.package]
# defer releases independently (defer@<version> tags). Every member inherits
# this version; build.sh and the release scripts read the first
# column-0 `version = "` line of this file.
version = "0.4.13"
edition = "2021"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
license = "MIT"
repository = "https://github.com/faberline/defer"

[workspace.dependencies]
# defer crates.
defer = { path = "crates/defer" }
defer-access = { path = "crates/defer-access" }
defer-dispatch = { path = "crates/defer-dispatch" }
defer-operator = { path = "crates/defer-operator" }
defer-queue = { path = "crates/defer-queue" }
defer-replication = { path = "crates/defer-replication" }
defer-shared-kernel = { path = "crates/defer-shared-kernel" }

# faberline/core building blocks.
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false }
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.14", version = "0.5" }
peer-tls = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
server-lifecycle = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-executor = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-observability = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
relay = { git = "https://github.com/faberline/relay", rev = "c7e3a7350b5e5867a1e7a3509cc894a6ce17e996" }

# Third-party. kube-rs versions mirror the other faberline users so the
# lockfile stays single-versioned.
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "string", "env"] }
hmac = "0.12"
k8s-openapi = { version = "0.24", features = ["v1_32"] }
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
utoipa = "4"

[workspace.lints.clippy]
mod_module_files = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
