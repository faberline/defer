[workspace]
resolver = "2"
members = ["."]

[workspace.package]
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/defer"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "rustls-tls-native-roots", "json", "cookies", "gzip", "brotli", "multipart", "stream"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
utoipa = "4"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
clap = { version = "4", features = ["derive", "string"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[package]
name = "defer"
version = "0.4.13"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Delayed push-queue scheduler core for Axiom"
build = "build.rs"

[lib]
name = "defer"
path = "src/lib.rs"

[[bin]]
name = "defer"
path = "src/bin/defer.rs"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
raft-runtime = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
storage-durable = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
anyhow = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
clap = { workspace = true, features = ["env"] }
cli-std = { git = "https://github.com/faberline/core", tag = "v0.4.14", default-features = false }
service-http = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
service-auth = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
metrics-prometheus = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
utoipa = { workspace = true }
serde_yaml = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
openapi-codegen = { git = "https://github.com/faberline/core", tag = "v0.4.14", version = "0.5" }
service-backup = { git = "https://github.com/faberline/core", tag = "v0.4.14", features = ["http-client"] }
service-executor = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
kube = { version = "0.98", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
schemars = { version = "0.8", optional = true }
service-k8s = { git = "https://github.com/faberline/core", tag = "v0.4.14", optional = true }
peer-tls = { git = "https://github.com/faberline/core", tag = "v0.4.14" }

[build-dependencies]
build-stamp = { git = "https://github.com/faberline/core", tag = "v0.4.14" }

[features]
default = []
self-update = ["cli-std/online"]
issue = ["cli-std/online"]
otel = ["service-http/otlp"]
backup = ["service-backup/s3"]
operator = ["dep:kube", "dep:k8s-openapi", "dep:schemars", "dep:service-k8s"]

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
tower = { workspace = true, features = ["util"] }
redis = { version = "0.27", features = ["tokio-comp"] }
relay = { git = "https://github.com/faberline/relay", rev = "c7e3a7350b5e5867a1e7a3509cc894a6ce17e996" }
service-observability = { git = "https://github.com/faberline/core", tag = "v0.4.14" }
