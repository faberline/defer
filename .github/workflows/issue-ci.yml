name: Issue CI handoff
on:
  workflow_run:
    workflows: ["defer-ci", "gke-test"]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write
# All handoff invocations share this group. Default pending replacement is
# safe because EVERY wake reconciles ALL managed PRs, including displaced wakes.
concurrency:
  group: issue-ci-handoff
  cancel-in-progress: false
jobs:
  handoff:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: faberline/aw/.github/actions/issue-ci@693e45bded9a4ec8167573e82b423c823c193ec0
        with:
          operation: handoff
          run-id: ${{ github.event.workflow_run.id }}
          policy: .github/issue-ci-required-gates.json
