# Pull-request and main CI: the same gates defer-release-candidate.yml runs
# before it builds a candidate, so a landed commit is already a candidate the
# release gates accept. scripts/release/verify-release-contract.py pins the
# two lists against each other.
name: defer-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: defer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: fmt, clippy, tests, release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: defer-ci
      - name: Run Defer gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace
          cargo test --locked -p defer --features operator --test operator
      - name: Release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/release/verify-release-contract.py --app defer
          python3 -B scripts/release/make-gke-release-receipt.py --self-test
