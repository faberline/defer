# What the suite reads and does in the run's namespace, and nothing
# cluster-wide: it reads the operator's objects and pods, backs up the group
# through its API, creates and deletes the Defer CR, the PVCs and the seed
# ConfigMap `defer-restore-seed`. Namespaced rights only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: defer-e2e
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defer-e2e
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["defer.dev"]
    resources: ["defers"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defer-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defer-e2e
subjects:
  - kind: ServiceAccount
    name: defer-e2e
    namespace: defer
