# What the suite reads and does in the run's namespace, and nothing
# cluster-wide: it reads the operator's objects and pods, runs `defer
# --version` in every defer pod, and deletes one defer pod for the replacement
# check. It also creates one Secret and patches the Defer CR for the scale
# test. Namespaced rights only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: defer-e2e
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: defer-e2e
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services", "endpoints", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: ["defer.dev"]
    resources: ["defers"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: defer-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: defer-e2e
subjects:
  - kind: ServiceAccount
    name: defer-e2e
    namespace: defer
