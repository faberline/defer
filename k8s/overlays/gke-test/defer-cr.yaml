# The Defer instance the e2e suites test: three replicas, so the operator renders
# StatefulSet/defer with the pods defer-0, defer-1 and defer-2, and the PVCs
# data-defer-0, data-defer-1 and data-defer-2. The suites reach it at
# http://defer:7141.
apiVersion: defer.dev/v1alpha1
kind: Defer
metadata:
  name: defer
spec:
  # Set by the workflow through ../kustomizeconfig.yaml.
  image: ghcr.io/faberline/defer:REPLACE_ME
  imagePullPolicy: IfNotPresent
  shardCount: 1
  replicasPerShard: 3
  voterCount: 3
  # The test pools are N4 machines, which take only Hyperdisk. The default
  # class standard-rwo is pd-balanced, so the PVC never binds there and the
  # autoscaler does not add a node. aw infra/gke-test/pools.yaml says PVCs on
  # these pools use dynamic-rwo. A hyperdisk-balanced disk is at least 4 GB,
  # so a smaller request fails with "Disk size cannot be smaller than 4 GB".
  storage: 4Gi
  storageClass: dynamic-rwo
  graceSecs: 1
  logLevel: info
  # Stated, not omitted: the suites test the PVC-retained queue state, not
  # auth.
  auth: "off"
  # Small enough to share an n4-standard-2 with the node's system pods.
  resources:
    cpu: 250m
    memory: 512Mi
  imagePullSecrets:
    - name: ghcr-pull
  placement:
    nodeSelector:
      faberline.dev/pool: defer-server
    tolerations:
      - key: faberline.dev/pool
        operator: Equal
        value: defer-server
        effect: NoSchedule
