apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: defers.defer.dev
spec:
  group: defer.dev
  names:
    categories: []
    kind: Defer
    plural: defers
    shortNames:
    - dfr
    singular: defer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for DeferSpec via `CustomResource`
        properties:
          spec:
            description: 'The generic cluster shape every sharded-HA service embeds in its CRD spec via `#[serde(flatten)] pub cluster: service_k8s::ClusterSpec`.'
            properties:
              auth:
                default: "off"
                type: string
              backup:
                description: |-
                  Kubernetes structural-schema-safe scheduled backup projection.

                  The runtime [`BackupPolicy`] uses a tagged [`BackupDestination`] enum whose variant schemas cannot be embedded directly in a CRD. This flat shape keeps the public `schedule`, `destination`, and `retentionSecs` fields shared by every service operator and validates them through one conversion path.
                nullable: true
                properties:
                  adminTokenSecret:
                    nullable: true
                    type: string
                  destination:
                    description: Destination URI accepted by [`BackupDestination::from_uri`].
                    type: string
                  retentionSecs:
                    description: Drop objects older than this many seconds after a successful put. `None` keeps every object.
                    type: integer
                    minimum: 0.0
                    nullable: true
                  schedule:
                    description: Cron expression rendered into `CronJob.spec.schedule`.
                    type: string
                required:
                - destination
                - schedule
                type: object
              bodyLimitBytes:
                default: 8388608
                description: 'Data-plane request body size limit (bytes). Requests with `Content-Length` over it are rejected with 413; streamed bodies are bounded mid-read. Defaults to 8 MiB, the `defer serve` default (`DEFER_BODY_LIMIT_BYTES`, #18).'
                type: integer
                minimum: 0.0
              bootstrapSeedUri:
                nullable: true
                type: string
              graceSecs:
                default: 10
                type: integer
                minimum: 0.0
              image:
                type: string
              imagePullPolicy:
                nullable: true
                type: string
              imagePullSecrets:
                description: Secrets in the instance's namespace used to pull `image`, copied to `imagePullSecrets` of every pod the operator renders (the serving StatefulSet and the optional backup CronJob). Empty means the node's own registry credentials, the previous behavior.
                items:
                  description: A Secret named in the instance's namespace, mirroring the Kubernetes `v1.LocalObjectReference`. Declared here because the CRD schema is derived with `schemars`, which `k8s-openapi`'s types do not implement.
                  properties:
                    name:
                      description: Name of a Secret of type `kubernetes.io/dockerconfigjson` in the instance's namespace.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              limits:
                description: Container resource limits for the serving StatefulSet container. Unset leaves the container unbounded (requests only), the previous behavior.
                nullable: true
                properties:
                  cpu:
                    description: Maximum CPU quantity (e.g. `500m`, `2`). Unset leaves CPU unbounded.
                    nullable: true
                    type: string
                  memory:
                    description: Maximum memory quantity (e.g. `512Mi`, `4Gi`). Unset leaves memory unbounded.
                    nullable: true
                    type: string
                type: object
              logLevel:
                nullable: true
                type: string
              peerTlsSecret:
                nullable: true
                type: string
              placement:
                description: |-
                  Which nodes the operator-rendered pods may run on. Unset leaves the scheduler free to pick any node, the previous behavior.

                  The StatefulSet is operator-rendered, so a `kubectl patch` adding a nodeSelector or toleration is reverted on the next reconcile; without this field a defer instance cannot be scheduled onto a tainted, dedicated node pool at all.
                nullable: true
                properties:
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: 'Pod `nodeSelector`, e.g. `{ "faberline.dev/pool": "defer-server" }`.'
                    type: object
                  tolerations:
                    description: Pod taint tolerations, so a dedicated node pool can carry a taint that keeps every other workload off it.
                    items:
                      description: |-
                        One entry of `placement.tolerations`, mirroring the Kubernetes `v1.Toleration` fields.

                        Declared here rather than reused from `k8s-openapi` because the CRD schema is derived with `schemars`, which `k8s-openapi`'s types do not implement.
                      properties:
                        effect:
                          description: '`NoSchedule`, `PreferNoSchedule`, or `NoExecute`. Unset tolerates every effect of the matching taint.'
                          nullable: true
                          type: string
                        key:
                          description: 'The taint key this tolerates. Empty with `operator: Exists` tolerates every taint.'
                          nullable: true
                          type: string
                        operator:
                          description: '`Exists` or `Equal`. Unset means `Equal` (the Kubernetes default).'
                          nullable: true
                          type: string
                        tolerationSeconds:
                          description: 'How long the pod stays bound after the node gains a matching taint. Only meaningful with `effect: NoExecute`.'
                          format: int64
                          nullable: true
                          type: integer
                        value:
                          description: 'The taint value to match. Only meaningful with `operator: Equal`.'
                          nullable: true
                          type: string
                      type: object
                    type: array
                type: object
              replicasPerShard:
                default: 1
                description: Starting/minimum members per shard. With startup-static raft-runtime membership this is also the fixed desired value; a future membership controller may plan whole replica layers above this floor.
                type: integer
                minimum: 0.0
              resources:
                default:
                  cpu: ''
                  memory: ''
                description: Per-pod CPU/memory requests. Empty values resolve to the shared data-plane defaults (`1` CPU / `4Gi`) at render time. Limits are intentionally omitted so a dedicated-node pod can use otherwise-idle node capacity.
                properties:
                  cpu:
                    default: ''
                    type: string
                  memory:
                    default: ''
                    type: string
                type: object
              shardCount:
                default: 1
                type: integer
                minimum: 0.0
              storage:
                default: 10Gi
                type: string
              storageClass:
                nullable: true
                type: string
              targetSigningKeyId:
                nullable: true
                type: string
              targetSigningSecret:
                nullable: true
                type: string
              tokensSecret:
                nullable: true
                type: string
              tokensSecretCsiDriver:
                description: CSI driver name for the `tokensSecretProviderClass` projection. Defaults to the community `secrets-store.csi.k8s.io`; GKE's managed Secrets Store add-on registers `secrets-store-gke.csi.k8s.io`, so GKE instances must set that value (#2456).
                nullable: true
                type: string
              tokensSecretProviderClass:
                nullable: true
                type: string
              voterCount:
                default: 1
                type: integer
                minimum: 0.0
            required:
            - image
            type: object
          status:
            nullable: true
            properties:
              desiredReplicas:
                default: 0
                format: int32
                type: integer
              message:
                default: ''
                type: string
              observedGeneration:
                default: 0
                format: int64
                type: integer
              phase:
                default: ''
                type: string
              readyReplicas:
                default: 0
                format: int32
                type: integer
            type: object
        required:
        - spec
        title: Defer
        type: object
    served: true
    storage: true
    subresources:
      status: {}
